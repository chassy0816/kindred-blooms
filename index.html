
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindred Blooms</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #fcfaf7;
    }
    h1, h2, h3 {
      font-family: 'Outfit', sans-serif;
    }
    .soft-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    .shimmer {
      background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media print {
      body {
        background-color: white !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      aside, .md\:hidden, button, .flex.bg-white.rounded-full.p-1 {
        display: none !important;
      }
      main {
        padding: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        background-color: white !important;
      }
      .max-w-3xl {
        max-width: 100% !important;
      }
      header {
        margin-bottom: 2rem !important;
      }
      img {
        max-height: 400px !important;
        width: auto !important;
        margin: 0 auto !important;
        display: block !important;
        border-radius: 1rem !important;
      }
      .grid {
        display: block !important;
      }
      .md\:col-span-1, .md\:col-span-2 {
        width: 100% !important;
        margin-bottom: 2rem !important;
      }
      section {
        box-shadow: none !important;
        border: 1px solid #eee !important;
        break-inside: avoid !important;
      }
      .bg-indigo-50 {
        background-color: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
      }
      .text-indigo-900, .text-indigo-800 {
        color: #1e293b !important;
      }
    }
  </style>

</html>
